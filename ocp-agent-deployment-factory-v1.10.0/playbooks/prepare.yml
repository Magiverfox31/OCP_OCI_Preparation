---
- import_playbook: dependencies.yml

- name: OpenShift factory - prepare (URL preflight, DNS/F5 checks, validate, render configs)
  hosts: localhost
  gather_facts: false
  vars:
    skip_preflight: false   # override with: -e skip_preflight=true
    skip_netcheck: false    # override with: -e skip_netcheck=true
  tasks:
    - name: Execute prepare stage
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/factory.py"
          - prepare
      environment:
        FACTORY_SKIP_PREFLIGHT: "{{ 'true' if (skip_preflight | bool) else 'false' }}"
        FACTORY_SKIP_NETCHECK: "{{ 'true' if (skip_netcheck | bool) else 'false' }}"
      register: prepare_result
      changed_when: prepare_result.rc == 0
      failed_when: false

    - name: Show prepare output
      ansible.builtin.debug:
        msg: "{{ (prepare_result.stdout_lines | default([])) + (prepare_result.stderr_lines | default([])) }}"

    - name: Stop if prepare failed
      ansible.builtin.fail:
        msg: "prepare failed (exit code {{ prepare_result.rc }}); see the output above."
      when: prepare_result.rc != 0
