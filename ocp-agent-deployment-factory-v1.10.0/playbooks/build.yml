---
- import_playbook: dependencies.yml

- name: OpenShift factory - build (ISO and QCOW2)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Execute build stage
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/factory.py"
          - build
      register: build_result
      changed_when: true

    - name: Show build output
      ansible.builtin.debug:
        var: build_result.stdout_lines
