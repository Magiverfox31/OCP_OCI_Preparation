---
- name: OpenShift factory - approve
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Execute approve stage
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/factory.py"
          - approve
          - --run-id
          - "{{ run_id }}"
      changed_when: true
