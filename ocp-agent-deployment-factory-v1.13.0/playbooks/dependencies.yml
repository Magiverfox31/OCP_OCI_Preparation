---
# Required packages stop the run if they cannot be installed. Optional packages are diagnostic tools: the factory's
# checks have built-in fallbacks (see docs/NETWORK_VALIDATION.md), so a missing optional tool is reported, not fatal.
- name: Bootstrap Oracle Linux 9 bastion dependencies
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    required_packages:
      - python3
      - python3-pyyaml
      - python3-jinja2
      - qemu-img
      - nmstate        # openshift-install needs nmstatectl to build the agent ISO with static networking
      - tar
      - gzip
    optional_packages:
      - python3-pip
      - curl
      - bind-utils
      - nmap-ncat
      - iproute
      - openssl
    required_commands:
      - qemu-img
      - nmstatectl
    optional_commands:
      curl: "URL preflight and F5 REST checks use the built-in Python HTTP client instead"
      dig: "DNS checks use the built-in Python DNS resolver instead"
      nslookup: "only needed for manual DNS troubleshooting"
      nc: "only needed for manual TCP tests (the factory's own TCP probe uses Python); alternative: bash /dev/tcp"
      ip: "only needed for manual route/interface inspection"
      openssl: "only needed for manual TLS diagnostics"
  tasks:
    - name: Require Oracle Linux 9 on the bastion
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'OracleLinux'
          - ansible_facts.distribution_major_version == '9'
        fail_msg: "This dependency bootstrap supports Oracle Linux 9 only."

    - name: Install required packages from configured DNF repositories
      ansible.builtin.dnf:
        name: "{{ required_packages }}"
        state: present
        update_cache: false

    - name: Install optional diagnostic packages (a failure here is tolerated)
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
        update_cache: false
      loop: "{{ optional_packages }}"
      ignore_errors: true

    - name: Verify required commands are available
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      loop: "{{ required_commands }}"
      changed_when: false

    - name: Check optional commands
      ansible.builtin.shell: "command -v {{ item.key }}"
      args:
        executable: /bin/bash
      loop: "{{ optional_commands | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: optional_check
      changed_when: false
      failed_when: false

    - name: Note optional tools that are missing
      ansible.builtin.debug:
        msg: "Optional tool '{{ item.item.key }}' not found: {{ item.item.value }}"
      loop: "{{ optional_check.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.rc != 0

    - name: Verify Python modules needed by factory
      ansible.builtin.command:
        argv: [python3, -c, "import yaml, jinja2"]
      changed_when: false
      register: python_deps
      failed_when: false

    - name: Explain missing Python modules
      ansible.builtin.assert:
        that: python_deps.rc == 0
        fail_msg: "Python modules missing from system python3 after DNF installation; verify Oracle Linux repositories and python3-pyyaml/python3-jinja2 packages."
