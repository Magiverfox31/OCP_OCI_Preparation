---
- name: Bootstrap Oracle Linux 9 bastion dependencies
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tasks:
    - name: Require Oracle Linux 9 on the bastion
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'OracleLinux'
          - ansible_facts.distribution_major_version == '9'
        fail_msg: "This dependency bootstrap supports Oracle Linux 9 only."
    - name: Install required system utilities from configured DNF repositories
      ansible.builtin.dnf:
        name:
          - curl
          - nmap-ncat
          - nmstate
          - qemu-img
          - bind-utils
          - iproute
          - openssl
          - tar
          - gzip
          - python3
          - python3-pip
          - python3-pyyaml
          - python3-jinja2
        state: present
        update_cache: false
    - name: Verify required commands are available
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      loop:
        - curl
        - nc
        - nmstatectl
        - qemu-img
        - dig
        - nslookup
        - ip
        - openssl
      changed_when: false
    - name: Verify Python modules needed by factory
      ansible.builtin.command:
        argv: [python3, -c, "import yaml, jinja2"]
      changed_when: false
      register: python_deps
      failed_when: false
    - name: Explain missing Python modules
      ansible.builtin.assert:
        that: python_deps.rc == 0
        fail_msg: "Python modules missing from system python3 after DNF installation; verify Oracle Linux repositories and python3-pyyaml/python3-jinja2 packages."
